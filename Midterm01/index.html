<html>
    <head>
        <title>Color Changing Title</title>
        <style>
            body{
                text-align:center;
                font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            }
            button{
                padding:10px 20px;
                font-size: 16px;
            }
        </style>
    </head>
    <body>
        <h1 id="heading">Click the button to change colors!</h1>
        <button onclick="changeColor()">Change Colors</button>
        <script>
            const colors=['blue', 'red', 'green', 'yellow', 'orange', 'purple', 'pink'];

            function changeColor(){
                const randomColor=colors[Math.floor(Math.random()*colors.length)];
                document.getElementById('heading').style.color=randomColor;
            }
            document.getElementById('btn').addEventListener('click', changeColor);
        </script>
    </body>

</html>
