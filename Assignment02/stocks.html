<!DOCTYPE html>
<html>
  <head>
    <title>Stocks</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/annyang/2.6.1/annyang.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>

  <body>
    <header>
      <h1>Stock Lookup</h1>
    </header>

    <nav class="top-nav">
      <a href="home.html">Home</a>
      <a href="stocks.html">Stocks</a>
      <a href="dogs.html">Dogs</a>
    </nav>

    <section class="main-container">
      <div class="card">
        <h2>Enter Stock</h2>

        <input
          id="ticker"
          placeholder="AAPL"
          style="width: 90%; height: 35px; font-size: 16px"
        />

        <select
          id="days"
          style="width: 95%; height: 35px; font-size: 16px; margin-top: 10px"
        >
          <option value="30">30 Days</option>
          <option value="60">60 Days</option>
          <option value="90">90 Days</option>
        </select>

        <div class="button-row" style="margin-top: 10px">
          <button class="button-1" onclick="loadStock()">Load Chart</button>
        </div>

        <canvas
          id="chart"
          width="350"
          height="250"
          style="margin-top: 15px"
        ></canvas>
      </div>

      <div class="card">
        <h2>Voice Commands</h2>
        <p>Say: "Lookup Apple"</p>
        <p>Say: "Lookup Tesla"</p>
        <button class="button-1" onclick="startVoice()">Turn On</button>
        <button class="button-1" onclick="stopVoice()">Turn Off</button>
      </div>
    </section>

    <footer>©2025 Class Activities Website</footer>

    <script>
      const API_KEY = "1Ce3GdKpxdYdWOv43sSIuI9tZqssKbq7";
      let chart;

      async function loadStock() {
        const symbol = document.getElementById("ticker").value.toUpperCase();
        const days = parseInt(document.getElementById("days").value);

        const end = new Date();
        const start = new Date();
        start.setDate(end.getDate() - days);
        const fmt = (d) => d.toISOString().split("T")[0];

        const url = `https://api.massive.com/v2/aggs/ticker/${symbol}/range/1/day/${fmt(
          start
        )}/${fmt(end)}?apiKey=${API_KEY}`;

        const response = await fetch(url);
        const data = await response.json();

        if (!data.results) {
          alert("No data found.");
          return;
        }

        const labels = data.results.map((r) =>
          new Date(r.t).toLocaleDateString()
        );
        const prices = data.results.map((r) => r.c);

        if (chart) chart.destroy();

        chart = new Chart(document.getElementById("chart"), {
          type: "line",
          data: {
            labels: labels,
            datasets: [
              {
                label: symbol,
                data: prices,
                borderColor: "#EA4C89",
                tension: 0.2,
              },
            ],
          },
        });
      }

      function startVoice() {
        if (annyang) {
          const commands = {
            "lookup *stock": (stock) => {
              document.getElementById("ticker").value = stock;
              loadStock();
            },
          };
          annyang.addCommands(commands);
          annyang.start();
        }
      }

      function stopVoice() {
        if (annyang) annyang.abort();
      }
    </script>
  </body>
</html>
